<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Barbearia Navalha de Ouro - Início</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; color: #333; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; font-weight: bold; color: #2c3e50; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .destaque { font-size: 2em; font-weight: bold; color: #e67e22; }
    </style>
</head>
<body>
    <h1>Barbearia Navalha de Ouro</h1>

    <nav>
        <a href="{{ url_for('index') }}">Início</a>
        <a href="{{ url_for('ver_agendamentos') }}">Agendamentos</a>
    </nav>

    <div class="card">
        <h2>Painel de Controle</h2>
        <p>Total de agendamentos registrados no sistema:</p>
        <div class="destaque">{{ agendamentos|length }}</div>
    </div>
</body>
</html>
